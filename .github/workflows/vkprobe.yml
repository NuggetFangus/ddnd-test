name: Sonda Vulkan R36S
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@main
      - name: Compilar com glibc 2.28 (zig)
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pip libvulkan-dev
          sudo pip3 install --break-system-packages "ziglang==0.14.1"
          ZIG=$(python3 -c "import ziglang,os;print(os.path.join(os.path.dirname(ziglang.__file__),'zig'))")
          mkdir -p out
          $ZIG cc -target aarch64-linux-gnu.2.28 -O2 -I/usr/include vkprobe/vkprobe.c -o out/vkprobe -ldl
          file out/vkprobe
          objdump -T out/vkprobe | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -2
          cat > out/vkprobe.sh <<'SH'
          #!/bin/bash
          # Rode pelo menu de Ports do ArkOS. O resultado fica em vkprobe.txt, na mesma pasta.
          cd "$(dirname "$0")"
          ./vkprobe > /dev/null 2>&1
          SH
          sed -i 's/^          //' out/vkprobe.sh
          chmod +x out/vkprobe out/vkprobe.sh
      - uses: actions/upload-artifact@main
        with:
          name: vkprobe-r36s
          path: out/
