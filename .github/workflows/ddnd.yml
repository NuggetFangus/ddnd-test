name: DDND Wine+Box64 (ARM64)

# Testa se o Dong Dong Never Die (2D Fighter Maker, exe de Windows) abre em
# Wine x86_64 (WoW64) rodando sobre Box64, num runner ARM64 de verdade.
# Box64 é compilado com -DRK3326=ON (o mesmo alvo do R36S: Cortex-A35).
on:
  workflow_dispatch:
    inputs:
      game_url:
        description: "URL direta do zip do jogo (você fornece; nada do jogo fica no repositório)"
        required: true
      exe:
        description: "Caminho do exe dentro do zip"
        default: "GAME.EXE"
      seconds:
        description: "Segundos de jogo antes do screenshot"
        default: "40"

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@main

      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake python3 xvfb xdotool imagemagick x11-utils unzip xz-utils \
            libx11-6 libxext6 libxrender1 libfreetype6 libasound2t64 ca-certificates

      - name: Box64 (alvo RK3326)
        run: |
          git clone --depth 1 https://github.com/ptitSeb/box64
          cmake -S box64 -B box64/build -DRK3326=ON -DARM_DYNAREC=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build box64/build -j$(nproc)
          sudo cmake --install box64/build
          box64 --version

      - name: Wine x86_64 (Kron4ek, WoW64)
        run: |
          url=$(gh api repos/Kron4ek/Wine-Builds/releases --jq '[.[] | select(.prerelease==false)][0].assets[] | select(.name|test("amd64-wow64\\.tar\\.xz$")) | select(.name|test("staging|proton")|not) | .browser_download_url' | head -1)
          echo "Wine: $url"
          curl -L "$url" -o wine.tar.xz
          mkdir -p $HOME/wine && tar -xf wine.tar.xz -C $HOME/wine --strip-components=1
          ls $HOME/wine/bin | head

      - name: Baixar o jogo
        run: |
          mkdir game && curl -L "${{ inputs.game_url }}" -o game.zip
          # unzip sai com código 1 só por aviso de nomes de arquivo chineses; não é erro
          unzip -q game.zip -d game || [ $? -eq 1 ]
          find game -maxdepth 3 | head -40
          find game -maxdepth 3 -iname '*.exe' | head

      - name: Rodar com limites tipo R36S (1 núcleo, 700 MB, sem swap)
        run: |
          sudo apt-get install -y locales fonts-wqy-microhei fonts-noto-cjk procps >/dev/null; sudo locale-gen zh_CN.UTF-8 >/dev/null || true
          fc-cache -f >/dev/null 2>&1 || true
          W=$HOME/wine/bin/wine64; [ -x $W ] || W=$HOME/wine/bin/wine
          cat > $PWD/t.sh <<SCRIPT
          #!/bin/bash
          exec > $PWD/t.out 2>&1
          export HOME=$HOME PATH=$PATH WINEPREFIX=$HOME/pfx2 WINEDEBUG=err+all,fixme-all BOX64_LOG=0 BOX64_DYNAREC_STRONGMEM=1
          export WINEDLLOVERRIDES="mscoree,mshtml=" LANG=zh_CN.UTF-8 LC_ALL=zh_CN.UTF-8 DISPLAY=:99
          cd $PWD
          Xvfb :99 -screen 0 640x480x16 >/dev/null 2>&1 &
          sleep 2
          s=\$(date +%s); timeout 600 box64 $W wineboot -i > boot.log 2>&1; echo "wineboot exit=\$? em \$((\$(date +%s)-s))s"
          EXE=\$(find game -iname "\$(basename '${{ inputs.exe }}')" | head -1); echo "exe: \$EXE"
          cd "\$(dirname "\$EXE")"
          ( box64 $W "\$(basename "\$EXE")" > $PWD/run.log 2>&1; echo "game exit=\$?" >> $PWD/run.log ) &
          sleep 12
          for k in 1 2 3 4 5 6 7 8; do xdotool key Return; sleep 4; done
          import -window root $PWD/shot_a.png || true
          echo "--- uso de CPU (ps, %cpu acumulado por processo)"; ps -eo pid,pcpu,rss,etime,comm --sort=-pcpu | head -8
          sleep 20
          import -window root $PWD/shot_b.png || true
          echo "--- PSS real somado (MB) de wine/box64/Xvfb"
          tot=0; for p in \$(pgrep -f 'wine|box64|Xvfb|GAME'); do v=\$(awk '/^Pss:/{print \$2}' /proc/\$p/smaps_rollup 2>/dev/null); tot=\$((tot+\${v:-0})); done; echo "PSS total: \$((tot/1024)) MB"
          cg=/sys/fs/cgroup/ddnd
          echo "cgroup memory.peak: \$(( \$(cat \$cg/memory.peak 2>/dev/null || echo 0) / 1048576 )) MB"; echo "oom: \$(grep -E 'oom|max' \$cg/memory.events 2>/dev/null | tr '\\n' ' ')"
          echo "--- processos"; pgrep -af 'wine|box64|GAME' | wc -l
          echo "--- run.log (fim)"; tail -15 $PWD/run.log
          wineserver -k 2>/dev/null; pkill Xvfb; true
          SCRIPT
          sed -i 's/^          //' t.sh; chmod +x t.sh
          # grupo de controle (cgroup v2) criado à mão: 700 MB, sem swap
          sudo mkdir -p /sys/fs/cgroup/ddnd
          echo "+memory" | sudo tee /sys/fs/cgroup/cgroup.subtree_control >/dev/null 2>&1 || true
          echo 734003200 | sudo tee /sys/fs/cgroup/ddnd/memory.max
          echo 0 | sudo tee /sys/fs/cgroup/ddnd/memory.swap.max
          U=$(id -un)
          sudo bash -c "echo \$\$ > /sys/fs/cgroup/ddnd/cgroup.procs; exec taskset -c 0 sudo -u $U ./t.sh" || echo "t.sh saiu com $?"
          echo "=== saída do t.sh"; cat t.out
          echo "--- cgroup final"; cat /sys/fs/cgroup/ddnd/memory.peak /sys/fs/cgroup/ddnd/memory.events 2>&1
          sudo dmesg 2>/dev/null | grep -i -E 'out of memory|oom-kill|killed process' | tail -5 || true
          for f in shot_a.png shot_b.png; do
            [ -f "$f" ] || continue
            convert "$f" -colors 48 -define png:compression-level=9 /tmp/s.png
            echo "SHOT-BEGIN $f $(stat -c %s /tmp/s.png)"; base64 -w0 /tmp/s.png; echo; echo SHOT-END
          done

      - uses: actions/upload-artifact@main
        if: always()
        with:
          name: ddnd-resultado
          path: |
            *.log
            shot_*.png
